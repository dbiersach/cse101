[project]
name = "cse101"
version = "0.1.0"
description = "Foundations of Control System Electronics (CSE101)"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "adafruit-blinka>=8.68.0",
    "adafruit-circuitpython-ads1x15>=3.0.2",
    "adafruit-circuitpython-bh1750>=1.1.19",
    "adafruit-circuitpython-busdevice>=5.2.14",
    "adafruit-circuitpython-debouncer>=2.0.13",
    "adafruit-circuitpython-ina219>=3.4.31",
    "adafruit-circuitpython-ina260>=1.3.20",
    "adafruit-circuitpython-mcp4725>=1.4.19",
    "adafruit-circuitpython-mlx90393>=2.3.7",
    "adafruit-circuitpython-mmc56x3>=1.0.14",
    "adafruit-circuitpython-motor>=3.4.18",
    "adafruit-circuitpython-msa301>=1.3.11",
    "adafruit-circuitpython-neopixel>=6.3.18",
    "adafruit-circuitpython-pixelbuf>=2.0.10",
    "adafruit-circuitpython-register>=1.11.1",
    "adafruit-circuitpython-si5351>=1.4.9",
    "adafruit-circuitpython-ticks>=1.1.5",
    "beautifulsoup4>=4.15.0",
    "hidapi>=0.14.0.post4",
    # Pin to the stable 6.x line: ipykernel 7's subshell/control-channel
    # rewrite drops execute_reply/idle messages on Windows, leaving VS Code
    # cells stuck spinning even though the kernel finished (vscode-jupyter #17228).
    "ipykernel<7",
    "ipympl",
    "ipython",
    "jupyter",
    "matplotlib>=3.10.7",
    "numba>=0.63.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    # pygame-ce, not pygame: upstream pygame ships no Python 3.14 wheel, and
    # building it from source fails on Windows. pygame-ce is the community
    # fork and a drop-in replacement - it still imports as "pygame".
    "pygame-ce",
    "pyserial>=3.5",
    "pyside6",
    "pyside6-addons",
    "rich>=15.0.0",
    "ruff==0.16.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "selenium>=4.46.0",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
    "webdriver-manager>=4.1.2",
]

[tool.uv]
# Resolve for all three target platforms so uv.lock works for students on
# Windows, macOS, and Linux - not just the machine that last ran 'uv sync'.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.ruff]
extend-include = ["*.ipynb"]
lint.extend-select = ["I", "C4", "ISC", "SIM", "TCH"]
lint.ignore = []
show-fixes = true
target-version = "py314"
